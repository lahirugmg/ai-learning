<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 550" width="850" height="550"><!-- svg-source:excalidraw -->
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  </style>
  <rect x="0" y="0" width="850" height="550" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="425" y="32" font-size="20" fill="#0f172a" text-anchor="middle" font-weight="bold">Network architecture: Input(2) → Hidden(4) → Output(1)</text>

  <!-- === Input Layer === -->
  <text x="80" y="70" font-size="15" fill="#2563eb" text-anchor="middle" font-weight="bold">Input Layer</text>
  <text x="80" y="88" font-size="12" fill="#475569" text-anchor="middle">2 features</text>

  <!-- Input neuron 1 -->
  <circle cx="80" cy="175" r="35" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="80" y="170" font-size="13" fill="#0f172a" text-anchor="middle">hours</text>
  <text x="80" y="188" font-size="13" fill="#0f172a" text-anchor="middle">studied</text>

  <!-- Input neuron 2 -->
  <circle cx="80" cy="375" r="35" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="80" y="370" font-size="13" fill="#0f172a" text-anchor="middle">hours</text>
  <text x="80" y="388" font-size="13" fill="#0f172a" text-anchor="middle">slept</text>

  <!-- === Hidden Layer === -->
  <text x="370" y="70" font-size="15" fill="#7c3aed" text-anchor="middle" font-weight="bold">Hidden Layer</text>
  <text x="370" y="88" font-size="12" fill="#475569" text-anchor="middle">4 neurons, ReLU</text>

  <!-- Hidden neuron 1 -->
  <circle cx="370" cy="120" r="32" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="370" y="125" font-size="13" fill="#0f172a" text-anchor="middle">h₁</text>

  <!-- Hidden neuron 2 -->
  <circle cx="370" cy="220" r="32" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="370" y="225" font-size="13" fill="#0f172a" text-anchor="middle">h₂</text>

  <!-- Hidden neuron 3 -->
  <circle cx="370" cy="320" r="32" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="370" y="325" font-size="13" fill="#0f172a" text-anchor="middle">h₃</text>

  <!-- Hidden neuron 4 -->
  <circle cx="370" cy="420" r="32" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="370" y="425" font-size="13" fill="#0f172a" text-anchor="middle">h₄</text>

  <!-- === Output Layer === -->
  <text x="660" y="70" font-size="15" fill="#d97706" text-anchor="middle" font-weight="bold">Output Layer</text>
  <text x="660" y="88" font-size="12" fill="#475569" text-anchor="middle">1 neuron, Sigmoid</text>

  <!-- Output neuron -->
  <circle cx="660" cy="270" r="40" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="660" y="265" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="bold">P(pass)</text>
  <text x="660" y="285" font-size="12" fill="#475569" text-anchor="middle">0 to 1</text>

  <!-- Output arrow -->
  <line x1="700" y1="270" x2="770" y2="270" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="800" y="265" font-size="14" fill="#0f172a" text-anchor="start">Pass?</text>
  <text x="800" y="283" font-size="12" fill="#475569" text-anchor="start">≥ 0.5 → yes</text>

  <!-- === Connections: Input → Hidden (all 2×4 = 8 lines) === -->
  <!-- Input 1 to all hidden -->
  <line x1="115" y1="175" x2="338" y2="120" stroke="#94a3b8" stroke-width="1" opacity="0.5"/>
  <line x1="115" y1="175" x2="338" y2="220" stroke="#94a3b8" stroke-width="1" opacity="0.5"/>
  <line x1="115" y1="175" x2="338" y2="320" stroke="#94a3b8" stroke-width="1" opacity="0.5"/>
  <line x1="115" y1="175" x2="338" y2="420" stroke="#94a3b8" stroke-width="1" opacity="0.5"/>
  <!-- Input 2 to all hidden -->
  <line x1="115" y1="375" x2="338" y2="120" stroke="#94a3b8" stroke-width="1" opacity="0.5"/>
  <line x1="115" y1="375" x2="338" y2="220" stroke="#94a3b8" stroke-width="1" opacity="0.5"/>
  <line x1="115" y1="375" x2="338" y2="320" stroke="#94a3b8" stroke-width="1" opacity="0.5"/>
  <line x1="115" y1="375" x2="338" y2="420" stroke="#94a3b8" stroke-width="1" opacity="0.5"/>

  <!-- === Connections: Hidden → Output (4 lines) === -->
  <line x1="402" y1="120" x2="620" y2="270" stroke="#94a3b8" stroke-width="1" opacity="0.5"/>
  <line x1="402" y1="220" x2="620" y2="270" stroke="#94a3b8" stroke-width="1" opacity="0.5"/>
  <line x1="402" y1="320" x2="620" y2="270" stroke="#94a3b8" stroke-width="1" opacity="0.5"/>
  <line x1="402" y1="420" x2="620" y2="270" stroke="#94a3b8" stroke-width="1" opacity="0.5"/>

  <!-- Weight labels -->
  <text x="220" y="135" font-size="11" fill="#7c3aed" text-anchor="middle">W1</text>
  <text x="220" y="150" font-size="11" fill="#94a3b8" text-anchor="middle">(2×4 = 8 weights)</text>
  <text x="520" y="185" font-size="11" fill="#7c3aed" text-anchor="middle">W2</text>
  <text x="520" y="200" font-size="11" fill="#94a3b8" text-anchor="middle">(4×1 = 4 weights)</text>

  <!-- Bottom note -->
  <rect x="100" y="475" width="650" height="55" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="425" y="497" font-size="13" fill="#334155" text-anchor="middle">Each line is a weight. Total parameters: (2×4) + 4 biases + (4×1) + 1 bias = 17</text>
  <text x="425" y="517" font-size="13" fill="#475569" text-anchor="middle">Every hidden neuron learns a different linear boundary. Together they form a curved boundary.</text>
</svg>

