<!-- svg-source:excalidraw -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" width="900" height="700">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&amp;display=swap');
    text { font-family: 'Nunito', sans-serif; }
  </style>

  <!-- Background -->
  <rect width="900" height="700" fill="#ffffff" rx="0" ry="0"/>

  <!-- Title note at top center -->
  <text x="450" y="32" text-anchor="middle" font-size="14" font-weight="700" fill="#475569" font-family="Nunito, sans-serif">
    Repeat for 50 epochs (each epoch = one pass through all data)
  </text>

  <!-- ================= MAIN LOOP BOXES ================= -->

  <!-- 1. Training Data — top left -->
  <rect x="70" y="80" width="240" height="100" rx="12" ry="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="190" y="110" text-anchor="middle" font-size="15" font-weight="700" fill="#2563eb" font-family="Nunito, sans-serif">Training Data</text>
  <text x="190" y="133" text-anchor="middle" font-size="11" fill="#1e40af" font-family="Nunito, sans-serif">Input: "the cat sat on"</text>
  <text x="190" y="151" text-anchor="middle" font-size="11" fill="#1e40af" font-family="Nunito, sans-serif">Target: "a"</text>
  <!-- Step number -->
  <circle cx="88" cy="98" r="11" fill="#2563eb"/>
  <text x="88" y="102" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff" font-family="Nunito, sans-serif">1</text>

  <!-- 2. Model — top right -->
  <rect x="500" y="80" width="240" height="100" rx="12" ry="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="620" y="110" text-anchor="middle" font-size="15" font-weight="700" fill="#7c3aed" font-family="Nunito, sans-serif">Model</text>
  <text x="620" y="133" text-anchor="middle" font-size="11" fill="#5b21b6" font-family="Nunito, sans-serif">predicts probabilities</text>
  <text x="620" y="151" text-anchor="middle" font-size="11" fill="#5b21b6" font-family="Nunito, sans-serif">for every word</text>
  <!-- Step number -->
  <circle cx="518" cy="98" r="11" fill="#7c3aed"/>
  <text x="518" y="102" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff" font-family="Nunito, sans-serif">2</text>

  <!-- 3. Loss Function — right side -->
  <rect x="560" y="290" width="260" height="110" rx="12" ry="12" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="690" y="318" text-anchor="middle" font-size="15" font-weight="700" fill="#d97706" font-family="Nunito, sans-serif">Loss Function</text>
  <text x="690" y="342" text-anchor="middle" font-size="10.5" fill="#92400e" font-family="Nunito, sans-serif">cross-entropy: measures how</text>
  <text x="690" y="358" text-anchor="middle" font-size="10.5" fill="#92400e" font-family="Nunito, sans-serif">wrong the prediction is</text>
  <text x="690" y="380" text-anchor="middle" font-size="10" fill="#78350f" font-style="italic" font-family="Nunito, sans-serif">loss = −log(P of correct word)</text>
  <!-- Step number -->
  <circle cx="578" cy="308" r="11" fill="#d97706"/>
  <text x="578" y="312" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff" font-family="Nunito, sans-serif">3</text>

  <!-- 4. Backpropagation — bottom center -->
  <rect x="330" y="475" width="260" height="110" rx="12" ry="12" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <text x="460" y="503" text-anchor="middle" font-size="15" font-weight="700" fill="#64748b" font-family="Nunito, sans-serif">Backpropagation</text>
  <text x="460" y="527" text-anchor="middle" font-size="10.5" fill="#334155" font-family="Nunito, sans-serif">calculates how each weight</text>
  <text x="460" y="543" text-anchor="middle" font-size="10.5" fill="#334155" font-family="Nunito, sans-serif">contributed to the error</text>
  <text x="460" y="565" text-anchor="middle" font-size="10" fill="#475569" font-style="italic" font-family="Nunito, sans-serif">uses the chain rule from calculus</text>
  <!-- Step number -->
  <circle cx="348" cy="493" r="11" fill="#64748b"/>
  <text x="348" y="497" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff" font-family="Nunito, sans-serif">4</text>

  <!-- 5. Update Weights — left side -->
  <rect x="70" y="290" width="260" height="110" rx="12" ry="12" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <text x="200" y="318" text-anchor="middle" font-size="15" font-weight="700" fill="#64748b" font-family="Nunito, sans-serif">Update Weights</text>
  <text x="200" y="342" text-anchor="middle" font-size="10.5" fill="#334155" font-family="Nunito, sans-serif">optimizer nudges each weight</text>
  <text x="200" y="358" text-anchor="middle" font-size="10.5" fill="#334155" font-family="Nunito, sans-serif">to reduce the loss</text>
  <text x="200" y="380" text-anchor="middle" font-size="10" fill="#475569" font-style="italic" font-family="Nunito, sans-serif">w = w − learning_rate × gradient</text>
  <!-- Step number -->
  <circle cx="88" cy="308" r="11" fill="#64748b"/>
  <text x="88" y="312" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff" font-family="Nunito, sans-serif">5</text>

  <!-- ================= ARROWS ================= -->
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,4 L0,8 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,4 L0,8 Z" fill="#7c3aed"/>
    </marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,4 L0,8 Z" fill="#d97706"/>
    </marker>
    <marker id="arrow-gray" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,4 L0,8 Z" fill="#64748b"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,4 L0,8 Z" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- Arrow 1→2: Training Data → Model (horizontal, top) -->
  <line x1="310" y1="130" x2="496" y2="130" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-blue)" stroke-linecap="round"/>
  <text x="403" y="120" text-anchor="middle" font-size="10" fill="#2563eb" font-family="Nunito, sans-serif">feed input</text>

  <!-- Arrow 2→3: Model → Loss Function (vertical, right side) -->
  <line x1="690" y1="180" x2="690" y2="286" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#arrow-purple)" stroke-linecap="round"/>
  <text x="710" y="238" text-anchor="start" font-size="10" fill="#7c3aed" font-family="Nunito, sans-serif" transform="rotate(90, 710, 218)">compare</text>

  <!-- Arrow 3→4: Loss Function → Backpropagation (diagonal, bottom-right to bottom-center) -->
  <path d="M 610 400 Q 570 450 594 472" fill="none" stroke="#d97706" stroke-width="2.5" marker-end="url(#arrow-amber)" stroke-linecap="round"/>
  <text x="570" y="440" text-anchor="middle" font-size="10" fill="#d97706" font-family="Nunito, sans-serif">compute gradients</text>

  <!-- Arrow 4→5: Backpropagation → Update Weights (diagonal, bottom-center to left) -->
  <path d="M 326 530 Q 290 490 334 400" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow-gray)" stroke-linecap="round"/>
  <text x="290" y="455" text-anchor="middle" font-size="10" fill="#64748b" font-family="Nunito, sans-serif">send gradients</text>

  <!-- Arrow 5→Model: Update Weights → Model (loop back, left side upward) -->
  <path d="M 120 290 Q 60 210 88 184" fill="none" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrow-green)" stroke-linecap="round" stroke-dasharray="6,4"/>
  <text x="42" y="230" text-anchor="middle" font-size="10" fill="#16a34a" font-weight="600" font-family="Nunito, sans-serif">repeat</text>

  <!-- ================= LOSS PROGRESS INSET ================= -->
  <rect x="640" y="530" width="220" height="130" rx="10" ry="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="750" y="553" text-anchor="middle" font-size="12" font-weight="700" fill="#15803d" font-family="Nunito, sans-serif">📉 Training Progress</text>

  <!-- Progress bars / entries -->
  <!-- Epoch 1 -->
  <text x="660" y="576" font-size="11" fill="#dc2626" font-weight="600" font-family="Nunito, sans-serif">Epoch  1:</text>
  <text x="730" y="576" font-size="11" fill="#dc2626" font-family="Nunito, sans-serif">loss = 3.8</text>
  <text x="800" y="576" font-size="9" fill="#991b1b" font-family="Nunito, sans-serif">(random guessing)</text>

  <!-- Epoch 25 -->
  <text x="660" y="600" font-size="11" fill="#d97706" font-weight="600" font-family="Nunito, sans-serif">Epoch 25:</text>
  <text x="730" y="600" font-size="11" fill="#d97706" font-family="Nunito, sans-serif">loss = 1.2</text>
  <text x="800" y="600" font-size="9" fill="#92400e" font-family="Nunito, sans-serif">(learning patterns)</text>

  <!-- Epoch 50 -->
  <text x="660" y="624" font-size="11" fill="#16a34a" font-weight="600" font-family="Nunito, sans-serif">Epoch 50:</text>
  <text x="730" y="624" font-size="11" fill="#16a34a" font-family="Nunito, sans-serif">loss = 0.3</text>
  <text x="800" y="624" font-size="9" fill="#15803d" font-family="Nunito, sans-serif">(good predictions)</text>

  <!-- Mini bar chart visualization -->
  <rect x="660" y="636" width="76" height="6" rx="3" fill="#fecaca"/>
  <rect x="660" y="636" width="76" height="6" rx="3" fill="#dc2626" opacity="0.6"/>

  <rect x="660" y="644" width="38" height="6" rx="3" fill="#fde68a"/>
  <rect x="660" y="644" width="38" height="6" rx="3" fill="#d97706" opacity="0.6"/>

  <rect x="660" y="652" width="12" height="6" rx="3" fill="#bbf7d0"/>
  <rect x="660" y="652" width="12" height="6" rx="3" fill="#16a34a" opacity="0.6"/>

</svg>
